[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgfm"
version = "0.1.0"
description = "Cylindrical geodesic flow matching"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "optax",
    "numpy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
